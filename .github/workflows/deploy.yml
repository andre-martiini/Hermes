name: Deploy Hermes (Firebase)

# Publica o sistema no Firebase (projeto gestao-hermes) automaticamente
# sempre que algo entra na branch `main` (por exemplo, ao fazer merge de um PR).
# Tambem pode ser disparado manualmente em:
#   Actions > Deploy Hermes (Firebase) > Run workflow.
#
# PRE-REQUISITOS (configurar uma unica vez em Settings > Secrets and variables > Actions):
#   - FIREBASE_SERVICE_ACCOUNT : conteudo JSON de uma chave de Service Account do
#                                projeto gestao-hermes com permissao de deploy.
#   - GEMINI_API_KEY           : chave usada no build do frontend (embutida no bundle).
# Veja .github/workflows/README-deploy.md para o passo a passo.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Garante que dois deploys nao rodem ao mesmo tempo pisando um no outro.
concurrency:
  group: deploy-hermes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) Gate de qualidade: roda os testes. Se falharem, o deploy NAO acontece.
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Rodar testes
        run: npm test

  # 2) Deploy completo no Firebase. So roda se o job de testes passar.
  deploy:
    name: Deploy Firebase
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias do frontend
        run: npm install

      - name: Build do frontend (Vite -> dist)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      # Necessario para o Firebase descobrir os triggers das Functions Node.
      # (As Functions Python sao resolvidas pelo proprio Firebase via venv.)
      - name: Instalar dependencias das Functions Node
        run: npm install --prefix functions_node

      - name: Autenticar no Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy (hosting + functions + firestore indexes + storage)
        run: >-
          firebase deploy
          --only hosting,functions,firestore:indexes,storage
          --project gestao-hermes
          --non-interactive
          --force
