<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes - Gestão à Vista</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      background-color: #f9fafb;
      color: #151c27;
      overflow-x: hidden;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 20px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }

    /* Animações suaves */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <link rel="stylesheet" href="/index.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root"></div>
  <script>
    (function () {
      const isLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if (!isLocalhost || !('serviceWorker' in navigator)) return;

      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
          .then(() => {
            if (navigator.serviceWorker.controller && !window.sessionStorage.getItem('hermes_sw_dev_reset')) {
              window.sessionStorage.setItem('hermes_sw_dev_reset', '1');
              window.location.reload();
            }
          })
          .catch((error) => {
            console.log('SW cleanup failed on localhost:', error);
          });
      });
    })();
  </script>
  <script type="module" src="/index.tsx"></script>
  <!-- O service worker e registrado pelo componente UpdatePrompt (virtual:pwa-register/react),
       nao aqui — esse era o registro sem logica de atualizacao que deixava abas antigas presas
       num bundle desatualizado apos cada deploy. -->
</body>

</html>
