<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Paleta da casa (a mesma dos tutoriais): azul-marinho, âmbar, cinzas claros. */
      :root {
        --ground: #0f172a;
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --accent: #f59e0b;
        --box: #1e293b;
        --font-display: "Segoe UI", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); color: var(--ink); }
      .cena { position: absolute; inset: 0; padding: 288px 90px 384px; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
      .etiqueta { color: var(--accent); font-size: 40px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h2 { font-size: 76px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .valor { font-size: 150px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
      .rotulo { font-size: 48px; color: var(--muted); }
      .item { display: flex; align-items: center; gap: 36px; background: var(--box); border-radius: 28px; padding: 40px 44px; }
      .pos { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: var(--ground); font-size: 56px; font-weight: 800; display: grid; place-items: center; flex: none; }
      .nome { font-size: 52px; font-weight: 600; flex: 1; }
      .pct { font-size: 56px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
      .etapa { display: flex; align-items: center; gap: 36px; background: var(--box); border-radius: 28px; padding: 36px 44px; border: 4px solid transparent; }
      .etapa .num { font-size: 48px; font-weight: 800; color: var(--muted); width: 64px; }
      .etapa .txt { font-size: 54px; font-weight: 600; }
      .seta { height: 40px; width: 6px; background: var(--muted); margin-left: 74px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <section id="c1" class="cena clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="etiqueta">Prestação de contas</div>
        <h2>Recurso executado em 2026</h2>
        <div class="valor" id="contador">R$ 0</div>
        <div class="rotulo">valores fictícios</div>
      </section>

      <section id="c2" class="cena clip" data-start="5" data-duration="5" data-track-index="0">
        <div class="etiqueta">Ranking</div>
        <h2>Onde o recurso foi aplicado</h2>
        <div class="item r"><div class="pos">1</div><div class="nome">Assistência estudantil</div><div class="pct">42%</div></div>
        <div class="item r"><div class="pos">2</div><div class="nome">Pesquisa</div><div class="pct">31%</div></div>
        <div class="item r"><div class="pos">3</div><div class="nome">Extensão</div><div class="pct">18%</div></div>
      </section>

      <section id="c3" class="cena clip" data-start="10" data-duration="5" data-track-index="0">
        <div class="etiqueta">Fluxo</div>
        <h2>Da demanda ao contrato</h2>
        <div class="etapa e" id="e1"><div class="num">1</div><div class="txt">Demanda</div></div>
        <div class="seta"></div>
        <div class="etapa e" id="e2"><div class="num">2</div><div class="txt">Planejamento</div></div>
        <div class="seta"></div>
        <div class="etapa e" id="e3"><div class="num">3</div><div class="txt">Licitação</div></div>
        <div class="seta"></div>
        <div class="etapa e" id="e4"><div class="num">4</div><div class="txt">Contrato</div></div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ENTRA = "expo.out"; // mais perto de cubic-bezier(0.16, 1, 0.3, 1)

      // Cena 1: número que conta
      tl.fromTo("#c1 .valor, #c1 .rotulo", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: ENTRA, stagger: 0.06 }, 0.1);
      const n = { v: 0 };
      const fmt = new Intl.NumberFormat("pt-BR");
      tl.to(n, { v: 1250000, duration: 2.2, ease: "power3.out",
        onUpdate: () => { document.getElementById("contador").textContent = "R$ " + fmt.format(Math.round(n.v)); } }, 0.5);
      tl.to("#c1", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.7);

      // Cena 2: ranking de 3 itens, do 3º para o 1º não — na ordem, com 0,5 s entre eles
      tl.fromTo("#c2 .etiqueta, #c2 h2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: ENTRA, stagger: 0.06 }, 5.1);
      tl.fromTo("#c2 .r", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.45, ease: ENTRA, stagger: 0.5 }, 5.6);
      tl.fromTo("#c2 .r:first-of-type .pos", { scale: 1 }, { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1, ease: "back.out(2)" }, 7.2);
      tl.to("#c2", { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.7);

      // Cena 3: fluxo de 4 etapas, a ativa ganha borda âmbar
      tl.fromTo("#c3 .etiqueta, #c3 h2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: ENTRA, stagger: 0.06 }, 10.1);
      tl.fromTo("#c3 .etapa, #c3 .seta", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: ENTRA, stagger: 0.25 }, 10.5);
      ["1", "2", "3", "4"].forEach((_, i) => {
        tl.to(`#e${i + 1}`, { borderColor: "#f59e0b", duration: 0.25 }, 11.6 + i * 0.7);
      });
      tl.to("#c3", { opacity: 0, duration: 0.3, ease: "power2.in" }, 14.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
